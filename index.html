s:8px;font-size:15px;background:var(--bg);outline:none}.actions{display:flex;gap:10px;margin-top:4px}.actions button{flex:1;padding:14px 0;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90%;text-align:center}.toast.show{opacity:1}.note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px}</style></head><body><div class="app"><div class="topbar"><div class="title">代驾收费计算器<small>滴滴 · E代驾 · 通用</small></div><div class="clock"><div id="clock">--:--</div><span class="badge t1" id="autoBadge">--</span></div></div><div class="platform" id="platformSeg"><button data-p="general">通用</button><button data-p="didi" class="on">滴滴代驾</button><button data-p="edaijia">E代驾</button></div><div class="platform" id="serviceSeg"><button data-s="normal" class="on">日常</button><button data-s="long">长途</button><button data-s="business">商务</button><button data-s="parking">代泊车</button></div><div class="card" id="pkgCard" style="display:none"><div class="label"><span>长途套餐</span></div><div class="tier-grid" id="pkgGrid"></div><div class="note" id="longRuleTip"></div></div><div class="card" id="bizCard" style="display:none"><div class="label"><span>商务时长</span></div><div class="stepper"><button class="btn" id="bizMinus">−</button><div class="val"><span id="bizVal">8</span><small>小时</small></div><button class="btn" id="bizPlus">＋</button></div><div class="note" id="bizRuleTip"></div></div><div class="card"><div class="label"><span>行程起终点</span><select id="citySelect" style="font-size:12px;padding:3px;border:1px solid var(--line);border-radius:6px ut(()=>el.classList.remove('show'),1500)}function fmt(n){return(Math.round(n*100)/100).toFixed(2)}function pad2(n){return String(n).padStart(2,'0')}function findTier(h){for(let i=0;i<RATE.tiers.length;i++){const t=RATE.tiers[i];if(t.s<t.e){if(h>=t.s&&h<t.e)return{idx:i,tier:t}}else{if(h>=t.s||h<t.e)return{idx:i,tier:t}}}return{idx:0,tier:RATE.tiers[0]}}function activeTier(){if(manualTierIdx>=0&&manualTierIdx<RATE.tiers.length)return{idx:manualTierIdx,tier:RATE.tiers[manualTierIdx]};return findTier(new Date().getHours())}function calc(){const dist=Math.max(0,parseFloat($('dist').value)||0);const wait=Math.max(0,parseInt($('waitVal').textContent)||0);const toll=Math.max(0,parseFloat($('toll').value)||0);const park=Math.max(0,parseFloat($('park').value)||0);const pickup=Math.max(0,parseFloat($('pickup').value)||0);const surge=Math.max(0,parseFloat($('surge').value)||0);if(serviceType==='long'&&RATE.long){const L=RATE.long,pkg=L.packages[Math.min(longPkgIdx,L.packages.length-1)],rows=[[pkg.name,'¥'+fmt(pkg.fee)],['含'+pkg.km+'km','']];let kmFee=0;const over=dist-pkg.km;if(over>0){const blocks=Math.ceil(over/L.overBlockKm);kmFee=blocks*L.overBlockFee;rows.push(['超'+over.toFixed(1)+'km','¥'+fmt(kmFee)])}const wFee=Math.max(0,wait-L.freeWait)*L.waitFee;if(wait>0)rows.push(['等候'+wait+'分',wFee>0?'¥'+fmt(wFee):'免费']);const surgeAmt=(pkg.fee+kmFee+wFee)*surge/100;if(pickup>0)rows.push(['接驾费','¥'+fmt(pickup)]);if(toll>0)rows.push(['路桥费','¥'+fmt(toll)]);if(park>0)rows.push(['停车费','¥'+fmt(park)]);return{total:pkg.fee+kmFee+wFee+pickup+surgeAmt+toll+park,rows:rows,dist:dist,tier:{label:'长途'},startFee:pkg.fee,kmFee:kmFee,waitFee:wFee}}if(serviceType==='business'&&RATE.business){const B=RATE.business,rows=[['商务基础费','¥'+fmt(B.baseFee)]];let extra=0;if(businessHours>B.baseHours){const overH=Math.min(businessHours-B.baseHours,B.overtimeLimit-B.workEnd);extra=overH*B.overtimeFee;rows.push(['超时'+overH+'h','¥'+fmt(extra)])}const surgeAmt=(B.baseFee+extra)*surge/100;if(pickup>0)rows.push([' ion(text,coord){if(coord)return coord;const data=await amapGet('/v3/geocode/geo',{address:text,city:currentCity});if(!data.geocodes||!data.geocodes.length)throw new Error('未找到');return data.geocodes[0].location}$('citySelect').value=currentCity;$('citySelect').addEventListener('change',e=>{currentCity=e.target.value;toast('城市已切:'+currentCity)})async function autoCalcDist(){const sp=$('startPoint').value.trim(),ep=$('endPoint').value.trim();if(!sp||!ep)return;const btn=$('calcDistBtn');btn.disabled=true;btn.textContent='测距中…';try{const origin=await resolveLocation(sp,$('startPoint').dataset.loc);const destination=await resolveLocation(ep,$('endPoint').dataset.loc);const data=await amapGet('/v3/direction/driving',{origin:origin,destination:destination});const path=data.route.paths[0];const km=path.distance/1000,min=Math.round(path.duration/60);$('dist').value=km.toFixed(1);const s=$('distSlider');if(km>parseFloat(s.max))s.max=Math.ceil(km/100)*100;s.value=km;const info=$('routeInfo');info.style.display='block';info.innerHTML='🚗 '+km.toFixed(1)+' km · 约'+min+'分钟';render();toast('距离已填入')}catch(e){toast(e.message||'测距失败')}finally{btn.disabled=false;btn.textContent='自动测距中…'}}$('calcDistBtn').addEventListener('click',autoCalcDist);$('endPoint').addEventListener('input',()=>{clearTimeout(autoTimer);autoTimer=setTimeout(autoCalcDist,600)});function doLocate(silent){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async pos=>{const c=pos.coords;const coord=c.longitude.toFixed(6)+','+c.latitude.toFixed(6);$('startPoint').dataset.loc=coord;try{const data=await amapGet('/v3/geocode/regeo',{location:coord});$('startPoint').value=data.regeocode.formatted_address;const city=(data.regeocode.addressComponent.city||'宁波').replace(/市$/,'');currentCity=city;$('citySelect').value=city;if(!silent)toast('已定位')}catch(e){$('startPoint').value='当前位置'}},()=>{if(!silent)toast('定位失败')},{timeout:5000})}$('locateBtn').addEventListener('click',()=>doLocate(false));setTimeout(()=>doLocate(true),1500);function render(){const r=calc();$('total').textContent=fmt(r.total);const isLong=serviceType==='long'&&RATE.long,isBiz=serviceType==='business'&&RATE.business,isPark=serviceType==='parking'&&RATE.parking;$('resultTitle').textContent=PRESETS[platform].name+' '+(isLong?'长途':isBiz?'商务':isPark?'代泊车':'日常');$('detail').innerHTML=r.rows.map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+v+'</b></div>').join('');$('pkgCard').style.display=isLong?'block':'none';$('bizCard').style.display=isBiz?'block':'none';document.querySelectorAll('.card').forEach(c=>{if(c.querySelector('#tierGrid'))c.style.display=(isLong||isBiz||isPark)?'none':'block';if(c.querySelector('#dist'))c.style.display=(isBiz)?'none':'block';if(c.querySelector('#waitVal'))c.style.display=(isBiz||isPark)?'none':'block'});if(isLong){const L=RATE.long;$('pkgGrid').innerHTML=L.packages.map((p,i)=>'<div class="t'+(i===longPkgIdx?' on':'')+'" data-i="'+i+'"><span class="p">¥'+p.fee+'</span>'+p.name+'</div>').join('');document.querySelectorAll('#pkgGrid .t').forEach(el=>el.addEventListener('click',()=>{longPkgIdx=parseInt(el.dataset.i);render()}));$('longRuleTip').textContent='超'+L.packages[longPkgIdx].km+'km每20km加20元';$('autoBadge').textContent='长途';$('autoBadge').className='badge t1'}else if(isBiz){const B=RATE.business;$('bizVal').textContent=businessHours;$('autoBadge').textContent='商务';$('autoBadge').className='badge t2'}else if(isPark){$('autoBadge').textContent='代泊车';$('autoBadge').className='badge t3'}else{const {idx}=activeTier();const t=RATE.tiers[idx];$('curTierName').textContent=t.label;$('curTierFee').textContent=t.fee;$('autoBadge').textContent=t.label;$('autoBadge').className='badge t'+(idx+1);$('tierGrid').innerHTML=RATE.tiers.map((t,i)=>'<div class="t'+(i===idx?' on':'')+'" data-i="'+i+'"><span class="p">¥'+t.fee+'</span>'+t.label+'</div>').join('');document.querySelectorAll('#tierGrid .t').forEach(el=>el.addEventListener('click',()=>{const i=parseInt(el.dataset.i);manualTierIdx=(manualTierIdx===i)?-1:i;render()}))}}$('dist').addEventListener('input',e=>{const v=parseFloat(e.target.value)||0;const s=$('distSlider');if(v>parseFloat(s.max))s.max=Math.ceil(v/100)*100;s.value=v;render()});$('distSlider').addEventListener('input',e=>{$('dist').value=e.target.value;render()});document.querySelectorAll('.chip[data-d]').forEach(c=>c.addEventListener('click',()=>{$('dist').value=c.dataset.d;$('distSlider').value=c.dataset.d;render()}));$('waitPlus').addEventListener('click',()=>{$('waitVal').textContent=parseInt($('waitVal').textContent)+1;render()});$('waitMinus').addEventListener('click',()=>{$('waitVal').textContent=Math.max(0,parseInt($('waitVal').textContent)-1);render()});['toll','park','pickup','surge'].forEach(id=>$(id).addEventListener('input',render));$('platformSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;platform=b.dataset.p;RATE=JSON.parse(JSON.stringify(PRESETS[platform]));manualTierIdx=-1;longPkgIdx=0;if((!RATE.long&&serviceType==='long')||(!RATE.business&&serviceType==='business')||(!RATE.parking&&serviceType==='parking'))serviceType='normal';document.querySelectorAll('#platformSeg button').forEach(x=>x.classList.toggle('on',x===b));render();toast('切到:'+PRESETS[platform].name)});$('serviceSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;if(s==='long'&&!RATE.long)return;if(s==='business'&&!RATE.business)return;if(s==='parking'&&!RATE.parking)return;serviceType=s;document.querySelectorAll('#serviceSeg button').forEach(x=>x.classList.toggle('on',x===b));render()});$('bizPlus').addEventListener('click',()=>{businessHours=Math.min(14,businessHours+1);render()});$('bizMinus').addEventListener('click',()=>{businessHours=Math.max(1,businessHours-1);render()});$('copyBtn').addEventListener('click',()=>{const r=calc();navigator.clipboard.writeText('合计:¥'+fmt(r.total)).then(()=>toast('已复制')).catch(()=>toast('复制失败'))});function tick(){const d=new Date();$('clock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())}setInterval(tick,20000);tick();render();</script></body></html>
